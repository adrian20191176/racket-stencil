<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Racket String Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <h2>Badminton Racket String Playground</h2>
            <div class="object-selector">
                <label>Select Object:</label>
                <button id="circle-btn" class="object-btn active">Circle</button>
                <button id="box-btn" class="object-btn">Box</button>
            </div>
            <div class="instructions">
                <p>Click on the racket strings to place objects. Drag objects to move them around.</p>
                <p>Click on an object to show resize handle. Drag the handle to resize objects.</p>
                <p>String segments turn black when objects overlap them, creating a logo effect.</p>
            </div>
        </div>
        
        <div class="playground-container">
            <svg id="playground" width="800" height="600" viewBox="0 0 800 600">
                <!-- Grid lines will be generated by JavaScript -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                    </pattern>
                </defs>
                
                <!-- Objects will be added here -->
                <g id="objects"></g>
            </svg>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
